[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "konsider"
version = "0.1.0"
description = "Evidence-backed and explainable country suitability for relocation decisions."
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Konsider" }]
dependencies = [
  "fastapi>=0.135,<0.139",
  "jsonschema>=4.23,<5",
  "openpyxl>=3.1,<4",
  "pydantic>=2.9,<3",
  "uvicorn>=0.35,<1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "ruff>=0.6",
  "black>=24.0",
  "httpx2>=2.5,<3",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.black]
line-length = 100
target-version = ["py311"]
